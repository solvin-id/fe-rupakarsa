[build]
  command = "npm run build -w @rupakarsa/creator"
  publish = "apps/creator/.next"
  ignore = "test -n \"$CACHED_COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/creator packages/shared"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
